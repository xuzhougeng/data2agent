# goreleaser release --clean   (run from portal/; CGO + go-duckdb prebuilt libs => one build per OS/arch on its own runner)
version: 2
project_name: portal
builds:
  - id: portal
    main: ./cmd/portal
    binary: portal
    env: [CGO_ENABLED=1]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "portal_{{ .Os }}_{{ .Arch }}"   # unversioned so releases/latest/download/... works in bootstrap.sh
checksum:
  name_template: checksums.txt
release:
  draft: true
